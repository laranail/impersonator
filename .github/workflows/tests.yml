name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full suite with every optional integration installed. Sanctum, Passport, JWT and
  # stancl/tenancy are dev dependencies precisely so their adapters are integration-tested
  # against the real packages rather than against a hand-written approximation.
  test:
    name: PHP ${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['13']
        stability: [prefer-stable]
        include:
          # One lowest-dependency run, on the floor. This is what catches a constraint that
          # claims ^8.3 while the code needs an 8.4 idiom, or a `^13.0` that only works
          # against the newest 13.x patch.
          - php: '8.3'
            laravel: '13'
            stability: prefer-lowest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci

  # The same suite with every optional integration *removed*.
  #
  # This is the job that matters for the dependency contract: the package must work with
  # illuminate/* alone. Installing the optional packages in every job would hide a hard
  # dependency that had crept into a driver, an adapter or the service provider — and the
  # first person to find it would be a user who does not have Passport installed.
  test-without-optional:
    name: No optional integrations · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Remove the optional integrations
        run: |
          composer remove --dev --no-update --no-interaction \
            laravel/sanctum laravel/passport tymon/jwt-auth stancl/tenancy

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the suite without the integration groups
        run: vendor/bin/pest --ci --exclude-group=sanctum,passport,jwt,tenancy

      # Proves absence rather than assuming it. `composer show` exiting non-zero is the
      # assertion: if any optional package resolved back in as a transitive requirement,
      # this job would otherwise pass while testing the wrong thing.
      - name: Assert the optional packages really are absent
        run: |
          for package in laravel/sanctum laravel/passport tymon/jwt-auth stancl/tenancy; do
            if composer show "$package" >/dev/null 2>&1; then
              echo "::error::$package is still installed; this job is not testing what it claims to."
              exit 1
            fi
          done

  # A boot-health gate, per the failure-handling standard: every degradable registration must
  # have completed after a normal boot. A degradable operation that silently failed leaves an
  # application that starts cleanly and quietly lacks a feature, which no functional test
  # catches — so it is asserted directly.
  boot-health:
    name: Boot health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Assert nothing degraded at boot
        run: vendor/bin/pest --ci tests/Feature/BootHealthTest.php
