name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan (level max)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  style:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check for pending refactorings
        run: vendor/bin/rector process --dry-run --no-progress-bar

  # The architecture boundary, run as its own job so a violation is unmistakable in the
  # checks list. `src/Core` must import no Illuminate code: that is what keeps the domain
  # logic portable and what stops framework concerns leaking into the authorization stack.
  architecture:
    name: Layering
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Assert the Core layer is framework-free
        run: vendor/bin/pest --ci tests/Arch

  composer-validate:
    name: composer validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # `--no-check-lock` deliberately: this is a library and its lock file is untracked, so
      # a lock complaint here would be a complaint about a file that must not exist.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
